<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">CDXML Toolkit</title>
  <desc id="desc">A technical cover showing a real ChemDraw render of aspirin and a request, resolve, render, verify workflow.</desc>

  <rect width="1200" height="400" rx="8" fill="#f7f9fa"/>
  <rect width="10" height="400" fill="#007c83"/>
  <path d="M792 42V358" stroke="#d4dde1" stroke-width="2"/>

  <g id="title-block" transform="translate(64 48)">
    <text x="0" y="0"
          fill="#007c83" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENTS · MCP · CHEMDRAW</text>
    <text x="0" y="72"
          fill="#17242b" font-size="58" font-weight="720"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">CDXML Toolkit</text>
    <text x="0" y="118"
          fill="#43545d" font-size="24" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Draw molecules and reaction schemes</text>
    <text x="0" y="152"
          fill="#43545d" font-size="24" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Editable CDXML and native ChemDraw output.</text>
  </g>

  <g id="workflow" transform="translate(64 278)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M10 18H550" stroke="#aebcc2" stroke-width="2"/>
    <path d="M550 18L537 10V26Z" fill="#aebcc2"/>

    <g transform="translate(0 0)">
      <circle cx="10" cy="18" r="10" fill="#007c83"/>
      <text x="0" y="58" fill="#17242b" font-size="18" font-weight="700">REQUEST</text>
      <text x="0" y="84" fill="#687981" font-size="16">name or identifier</text>
    </g>
    <g transform="translate(176 0)">
      <circle cx="10" cy="18" r="10" fill="#007c83"/>
      <text x="0" y="58" fill="#17242b" font-size="18" font-weight="700">RESOLVE</text>
      <text x="0" y="84" fill="#687981" font-size="16">grounded structure</text>
    </g>
    <g transform="translate(356 0)">
      <circle cx="10" cy="18" r="10" fill="#007c83"/>
      <text x="0" y="58" fill="#17242b" font-size="18" font-weight="700">RENDER</text>
      <text x="0" y="84" fill="#687981" font-size="16">ChemDraw COM</text>
    </g>
    <g transform="translate(536 0)">
      <circle cx="10" cy="18" r="10" fill="#d94f70"/>
      <text x="0" y="58" fill="#17242b" font-size="18" font-weight="700">VERIFY</text>
      <text x="0" y="84" fill="#687981" font-size="16">paths + warnings</text>
    </g>
  </g>

  <g id="native-proof">
    <path d="M836 50H814V90M1146 50H1168V90M836 326H814V286M1146 326H1168V286"
          fill="none" stroke="#007c83" stroke-width="3"/>
    <image x="842" y="42" width="298" height="298"
           preserveAspectRatio="xMidYMid meet"
           href="data:image/png;base64,"/>
    <circle cx="836" cy="358" r="6" fill="#d94f70"/>
    <text x="852" y="364"
          fill="#17242b" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NATIVE CHEMDRAW RENDER</text>
    <text x="852" y="388"
          fill="#687981" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ASPIRIN · CHEMISTRY PRESERVED</text>
  </g>
</svg>
