name: Native ChemDraw validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: [self-hosted, Windows, X64, chemdraw]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install complete runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y cdxml-toolkit
          python -m pip install -e ".[all,dev]"

      - name: Run native capability probes
        shell: pwsh
        run: |
          python -m cdxml_toolkit.mcp_runtime.runtime_diagnostics --native-probe --office-probe --json

      - name: Run native chemistry smoke test
        shell: pwsh
        run: |
          python scripts/native_smoke.py --output-dir native-smoke-output

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-chemdraw-diagnostics
          path: native-smoke-output
          if-no-files-found: warn
