name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install portable test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows,office,analysis,image,scientific]"

      - name: Verify package metadata
        shell: pwsh
        run: |
          python -c "import cdxml_toolkit, importlib.metadata as m; assert m.version('cdxml-toolkit-community') == cdxml_toolkit.__version__"

      - name: Verify generated MCP reference
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m cdxml_toolkit.mcp_runtime.generate_reference --markdown docs/mcp-tools.md --json docs/mcp-schema.json
          git diff --exit-code -- docs/mcp-tools.md docs/mcp-schema.json

      - name: Run portable tests
        run: python -m pytest -m "not network" -q

  package:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check .\dist\*

  mcp-compatibility:
    name: MCP SDK ${{ matrix.mcp-major }}.x
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mcp-major: "1"
            mcp-spec: "mcp>=1,<2"
          - mcp-major: "2"
            mcp-spec: "mcp>=2,<3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "${{ matrix.mcp-spec }}"

      - name: Run MCP compatibility tests
        run: >-
          python -m pytest
          tests/test_mcp_compat.py
          tests/runtime/test_mcp_compat.py
          tests/runtime/test_mcp_stdio.py
          -q
