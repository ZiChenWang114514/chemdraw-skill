name: Native ChemDraw validation

# Needs a self-hosted Windows runner with licensed, activated ChemDraw and desktop Office.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: [self-hosted, Windows, X64, chemdraw]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Install complete runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python skill/chemdraw/scripts/install_runtime.py --extras all dev

      - name: Run native capability probes
        shell: pwsh
        run: python skill/chemdraw/scripts/cdx.py doctor --native --office --chemscript

      - name: Run native chemistry smoke test
        shell: pwsh
        run: python toolkit/scripts/native_smoke.py --output-dir native-smoke-output

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-chemdraw-diagnostics
          path: native-smoke-output
          if-no-files-found: warn
