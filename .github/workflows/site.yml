name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/website.md"
      - "tests/site_smoke.mjs"
      - "tests/test_site.py"
      - "tests/daily_sources.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/website.md"
      - "tests/site_smoke.mjs"
      - "tests/test_site.py"
      - "tests/daily_sources.json"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website in headless Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SITE_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the runtime baseline test checks that the commit pinned in
          # skill/chemdraw/runtime.json holds the bundled toolkit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install RDKit
        run: python -m pip install "rdkit>=2025.03"

      - name: Check the repository and play the site
        run: python scripts/validate_distribution.py
