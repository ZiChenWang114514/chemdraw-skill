name: Landing page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/readme/gallery/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r assets/readme/gallery _site/gallery
          touch _site/.nojekyll
          sed -i "s#<lastmod>[^<]*</lastmod>#<lastmod>$(date -u +%F)</lastmod>#g" _site/sitemap.xml

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Tell Bing (and other IndexNow engines) the pages changed.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          key=$(ls site | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"zichenwang114514.github.io\",\"key\":\"$key\",\"keyLocation\":\"${base}${key}.txt\",\"urlList\":[\"${base}\",\"${base}en/\"]}" \
            https://api.indexnow.org/indexnow
