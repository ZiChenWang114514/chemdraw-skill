name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the runtime baseline test checks that the commit pinned in
          # skill/chemdraw/runtime.json holds the bundled toolkit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate prerequisite checker
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./scripts/check_prerequisites.ps1 -Python $python -Capabilities core -Json -SkipPythonPackages

      - name: Validate installer proposals
        run: |
          python scripts/install.py
          python scripts/install.py --agent claude agents gemini copilot cursor opencode --runtime

  full-portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        mcp-version: ["1.28.1", "2.0.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Install pinned MCP version
        run: python -m pip install "mcp==${{ matrix.mcp-version }}"

      - name: Install the bundled toolkit runtime with its test tools
        run: python skill/chemdraw/scripts/install_runtime.py --extras office publication scientific dev

      - name: Run complete portable Skill tests
        run: python -m pytest skill/chemdraw/tests -q

      - name: Check the installed runtime with the doctor
        run: python skill/chemdraw/scripts/cdx.py doctor

      - name: Exercise the command-line entry point
        run: |
          python skill/chemdraw/scripts/cdx.py tools --detail summary
          python skill/chemdraw/scripts/cdx.py build skill/chemdraw/assets/acs1996/example.json example.cdxml

  installer-end-to-end:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Run installer tests
        run: python -m unittest tests.test_installer -v

      - name: Install for two agents with a custom runtime location
        shell: bash
        run: >-
          python scripts/install.py --agent agents claude
          --project "$RUNNER_TEMP/project" --runtime --runtime-dir "$RUNNER_TEMP/runtime"
          --extras publication --apply

      - name: Use the installed copies from a plain interpreter
        shell: bash
        run: |
          for agent in .agents .claude; do
            skill="$RUNNER_TEMP/project/$agent/skills/chemdraw"
            python -I "$skill/scripts/cdx.py" tools --detail summary
            python -I "$skill/scripts/cdx.py" build "$skill/assets/acs1996/example.json" "$RUNNER_TEMP/$agent.cdxml"
            python "$skill/scripts/check_installation.py"
          done

      - name: Plan and inspect the optional atom-mapping backends
        shell: bash
        run: |
          python scripts/install.py --agent claude --project "$RUNNER_TEMP/project" --runtime --mapping
          skill="$RUNNER_TEMP/project/.claude/skills/chemdraw"
          python -I "$skill/scripts/cdx.py" install-mappers --dry-run
          python -I "$skill/scripts/cdx.py" install-mappers --status
          python -I "$skill/scripts/cdx.py" call map_reaction_atoms --json '{"reaction": "CC(=O)Cl.CCN>>CC(=O)NCC", "options": {"method": "mcs"}}'

  toolkit-tests:
    name: Toolkit on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Install the toolkit with its portable extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows,office,analysis,image,scientific]"

      - name: Verify package metadata
        run: python -c "import cdxml_toolkit, importlib.metadata as m; assert m.version('cdxml-toolkit-community') == cdxml_toolkit.__version__"

      - name: Verify generated MCP reference
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m cdxml_toolkit.mcp_runtime.generate_reference --markdown docs/mcp-tools.md --json docs/mcp-schema.json
          git diff --exit-code -- docs/mcp-tools.md docs/mcp-schema.json

      - name: Run portable toolkit tests
        run: python -m pytest -m "not network" -q

  toolkit-mcp-compatibility:
    name: Toolkit with MCP SDK ${{ matrix.mcp-major }}.x
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mcp-major: "1"
            mcp-spec: "mcp>=1,<2"
          - mcp-major: "2"
            mcp-spec: "mcp>=2,<3"
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "${{ matrix.mcp-spec }}"

      - name: Run MCP compatibility tests
        run: python -m pytest tests/test_mcp_compat.py tests/runtime/test_mcp_compat.py tests/runtime/test_mcp_stdio.py -q

  site:
    name: Website in headless Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SITE_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install RDKit
        run: python -m pip install "rdkit>=2025.03"

      - name: Check the chemistry and play the site
        run: python -m unittest tests.test_site -v

  toolkit-package:
    uses: ./.github/workflows/build.yml
