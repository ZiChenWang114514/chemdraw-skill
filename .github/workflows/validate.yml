name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate prerequisite checker
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./scripts/check_prerequisites.ps1 -Python $python -Capabilities core -Json -SkipPythonPackages

      - name: Validate installer dry run
        shell: pwsh
        run: |
          ./scripts/install.ps1
          ./scripts/install.ps1 -Runtime -Python (Get-Command python).Source

  full-portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        mcp-version: ["1.28.1", "2.0.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned toolkit runtime
        run: >-
          python -m pip install
          "mcp==${{ matrix.mcp-version }}"
          "pytest>=7"
          "requests>=2.31"

      - name: Install the documented runtime baseline
        run: python skill/chemdraw/scripts/install_runtime.py --extras office publication scientific

      - name: Run complete portable Skill tests
        run: python -m pytest skill/chemdraw/tests -q

      - name: Exercise the command-line entry point
        run: |
          python skill/chemdraw/scripts/cdx.py tools --detail summary
          python skill/chemdraw/scripts/cdx.py build skill/chemdraw/assets/acs1996/example.json example.cdxml
