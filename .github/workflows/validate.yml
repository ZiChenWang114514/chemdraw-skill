name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate prerequisite checker
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./scripts/check_prerequisites.ps1 -Python $python -Capabilities core -Json -SkipCodex -SkipPythonPackages

      - name: Validate installer dry run
        shell: pwsh
        run: ./scripts/install.ps1

  full-portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        mcp-version: ["1.28.1", "2.0.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned toolkit runtime
        run: >-
          python -m pip install
          "mcp==${{ matrix.mcp-version }}"
          "pytest>=7"
          "requests>=2.31"
          "cdxml-toolkit-community[office,publication] @ git+https://github.com/ZiChenWang114514/cdxml-toolkit-community.git@e07add1ecc27879f07a27780b1603cdfa596f2c2"

      - name: Run complete portable Skill tests
        run: python -m pytest skill/chemdraw/scripts -q
