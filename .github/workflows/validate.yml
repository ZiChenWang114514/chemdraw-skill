name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository distribution
        run: python scripts/validate_distribution.py

      - name: Validate prerequisite checker
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./scripts/check_prerequisites.ps1 -Python $python -Capabilities core -Json -SkipPythonPackages

      - name: Validate installer proposals
        run: |
          python scripts/install.py
          python scripts/install.py --agent claude agents gemini copilot cursor opencode --runtime

  full-portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        mcp-version: ["1.28.1", "2.0.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned toolkit runtime
        run: >-
          python -m pip install
          "mcp==${{ matrix.mcp-version }}"
          "pytest>=7"
          "requests>=2.31"

      - name: Install the bundled toolkit runtime
        run: python skill/chemdraw/scripts/install_runtime.py --extras office publication scientific

      - name: Run complete portable Skill tests
        run: python -m pytest skill/chemdraw/tests -q

      - name: Exercise the command-line entry point
        run: |
          python skill/chemdraw/scripts/cdx.py tools --detail summary
          python skill/chemdraw/scripts/cdx.py build skill/chemdraw/assets/acs1996/example.json example.cdxml

  installer-end-to-end:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run installer tests
        run: python -m unittest tests.test_installer -v

      - name: Install for two agents with a custom runtime location
        shell: bash
        run: >-
          python scripts/install.py --agent agents claude
          --project "$RUNNER_TEMP/project" --runtime --runtime-dir "$RUNNER_TEMP/runtime"
          --extras publication --apply

      - name: Use the installed copies from a plain interpreter
        shell: bash
        run: |
          for agent in .agents .claude; do
            skill="$RUNNER_TEMP/project/$agent/skills/chemdraw"
            python -I "$skill/scripts/cdx.py" tools --detail summary
            python -I "$skill/scripts/cdx.py" build "$skill/assets/acs1996/example.json" "$RUNNER_TEMP/$agent.cdxml"
            python "$skill/scripts/check_installation.py"
          done

  toolkit-tests:
    name: Toolkit on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Install the toolkit with its portable extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows,office,analysis,image,scientific]"

      - name: Verify package metadata
        run: python -c "import cdxml_toolkit, importlib.metadata as m; assert m.version('cdxml-toolkit-community') == cdxml_toolkit.__version__"

      - name: Verify generated MCP reference
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m cdxml_toolkit.mcp_runtime.generate_reference --markdown docs/mcp-tools.md --json docs/mcp-schema.json
          git diff --exit-code -- docs/mcp-tools.md docs/mcp-schema.json

      - name: Run portable toolkit tests
        run: python -m pytest -m "not network" -q

  toolkit-mcp-compatibility:
    name: Toolkit with MCP SDK ${{ matrix.mcp-major }}.x
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - mcp-major: "1"
            mcp-spec: "mcp>=1,<2"
          - mcp-major: "2"
            mcp-spec: "mcp>=2,<3"
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "${{ matrix.mcp-spec }}"

      - name: Run MCP compatibility tests
        run: python -m pytest tests/test_mcp_compat.py tests/runtime/test_mcp_compat.py tests/runtime/test_mcp_stdio.py -q

  toolkit-package:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check .\dist\*
