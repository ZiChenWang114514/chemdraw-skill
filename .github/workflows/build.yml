name: Build toolkit distributions

# Reusable: Validate calls it on every change and Release calls it for a version tag,
# so the package is always built and inspected by the same steps.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: toolkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Build and inspect distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check .\dist\*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-dist
          path: toolkit/dist/*
          if-no-files-found: error

  installed-wheel-smoke:
    # Install the wheel just built into a clean venv and call every tool from a folder where the
    # checkout's toolkit source is not importable, so files missing from the package show up.
    name: Installed wheel smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml

      - name: Download the built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolkit-dist
          path: ${{ runner.temp }}/dist

      - name: Install the wheel into a clean venv
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/clean"
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/dist/*.whl").FullName
          & "$env:RUNNER_TEMP/clean/Scripts/python.exe" -m pip install "$wheel[office,publication,scientific,analysis,image]"

      - name: Call every tool from outside the checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CHEMDRAW_ENGINE_HOME: ${{ runner.temp }}/no-engines
          CHEMDRAW_MAPPER_HOME: ${{ runner.temp }}/no-mappers
          CHEMDRAW_ACCEL: "off"
        run: |
          & "$env:RUNNER_TEMP/clean/Scripts/python.exe" -c "import cdxml_toolkit, pathlib, sys; p = pathlib.Path(cdxml_toolkit.__file__).resolve(); sys.exit(0 if 'site-packages' in p.parts else f'imported from {p}')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/clean/Scripts/python.exe" "$env:GITHUB_WORKSPACE/skill/chemdraw/scripts/smoke_all_tools.py" --output-dir "$env:RUNNER_TEMP/smoke" --without chemdraw,chemscript,office
