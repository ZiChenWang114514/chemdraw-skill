name: Release

# Pushing a version tag (for example v0.7.0a3) builds the toolkit and publishes a GitHub
# Release with the toolkit distributions and a zip of the Skill folder.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the toolkit version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' toolkit/pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match toolkit version $version"; exit 1; }

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolkit-dist
          path: dist

      - name: Package the Skill folder
        run: git archive --format=zip --prefix=chemdraw/ -o "dist/chemdraw-skill-$GITHUB_REF_NAME.zip" HEAD:skill/chemdraw

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag $prerelease
